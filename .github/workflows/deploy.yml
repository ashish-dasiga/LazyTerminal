name: Deploy Lazy Terminal Download Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend site
        run: npm run build

      - name: Ensure downloads and assets are in dist
        run: |
          mkdir -p dist/downloads
          cp -r public/downloads/* dist/downloads/ || true
          cp icon.jpeg dist/icon.jpeg || true
          cp public/favicon.ico dist/favicon.ico || true
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
